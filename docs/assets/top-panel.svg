<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" role="img" aria-labelledby="t d"><title id="t">Simplified AuMaNET top panel</title><desc id="d">Rear row HaLow antenna, sealed Ethernet and GNSS antenna coax exit. Front row USB-C PD charging and USB-C accessory host. No service console or DC barrel input.</desc><rect width="1100" height="820" rx="16" fill="#101c1c"/><g font-family="Arial,sans-serif" fill="#f0f3e8"><text x="35" y="38" font-size="14" letter-spacing="3" fill="#c6ed82">AuMaNET / TOP PANEL / REVISION 5</text><text x="35" y="79" font-size="32" font-weight="bold">Two USB-C ports. Clear roles.</text><text x="35" y="109" font-size="16" fill="#b8c8c0">Looking down onto top cap / proposed positions / not a drilling template</text><text x="250" y="156" font-size="14">REAR / ANTENNA SIDE</text><rect x="40" y="180" width="600" height="475" rx="35" fill="#344735" stroke="#9aaa82" stroke-width="3"/><rect x="61" y="201" width="558" height="433" rx="25" fill="#20352c" stroke="#9aaa82" stroke-dasharray="7 6"/><circle cx="140" cy="310" r="66" fill="none" stroke="#70866d" stroke-dasharray="5 5"/><circle cx="140" cy="310" r="42" fill="#14271f" stroke="#8cc4d0" stroke-width="3"/><circle cx="140" cy="310" r="19" fill="#819282"/><text x="140" y="400" text-anchor="middle" font-size="17" font-weight="bold">RF</text><text x="140" y="423" text-anchor="middle" font-size="12" fill="#b8c8c0">HaLow antenna</text><circle cx="340" cy="310" r="66" fill="none" stroke="#70866d" stroke-dasharray="5 5"/><circle cx="340" cy="310" r="42" fill="#14271f" stroke="#8cc4d0" stroke-width="3"/><path d="M316 292h48v29h-12v10h-24v-10h-12Z" fill="#819282"/><text x="340" y="400" text-anchor="middle" font-size="17" font-weight="bold">LAN</text><text x="340" y="423" text-anchor="middle" font-size="12" fill="#b8c8c0">Sealed Ethernet</text><circle cx="540" cy="310" r="66" fill="none" stroke="#70866d" stroke-dasharray="5 5"/><circle cx="540" cy="310" r="42" fill="#14271f" stroke="#8cc4d0" stroke-width="3"/><circle cx="540" cy="310" r="19" fill="#819282"/><text x="540" y="400" text-anchor="middle" font-size="17" font-weight="bold">GPS</text><text x="540" y="423" text-anchor="middle" font-size="12" fill="#b8c8c0">Antenna coax exit</text><circle cx="225" cy="515" r="66" fill="none" stroke="#70866d" stroke-dasharray="5 5"/><circle cx="225" cy="515" r="42" fill="#14271f" stroke="#ffd39b" stroke-width="3"/><rect x="202" y="506" width="46" height="18" rx="9" fill="#819282"/><text x="225" y="605" text-anchor="middle" font-size="17" font-weight="bold">C1</text><text x="225" y="628" text-anchor="middle" font-size="12" fill="#b8c8c0">USB-C PD CHARGE</text><circle cx="455" cy="515" r="66" fill="none" stroke="#70866d" stroke-dasharray="5 5"/><circle cx="455" cy="515" r="42" fill="#14271f" stroke="#8cc4d0" stroke-width="3"/><rect x="432" y="506" width="46" height="18" rx="9" fill="#819282"/><text x="455" y="605" text-anchor="middle" font-size="17" font-weight="bold">C2</text><text x="455" y="628" text-anchor="middle" font-size="12" fill="#b8c8c0">USB-C ACCESSORY</text><g fill="#c6ed82"><circle cx="290" cy="217" r="6"/><circle cx="340" cy="217" r="6"/><circle cx="390" cy="217" r="6"/></g><text x="340" y="244" text-anchor="middle" font-size="11">BAT / POWER / LINK</text><text x="245" y="688" font-size="14">FRONT / OPERATOR SIDE</text><text x="40" y="730" font-size="14">Nominal cap: 120 x 95 mm / verify connector and cap clearances</text><text x="695" y="211" font-size="21" font-weight="bold">C1 / charge the battery system</text><text x="695" y="245" font-size="15">USB-C PD -> 3S charger -> pack</text><text x="695" y="271" font-size="15">Managed power path for charge-and-run</text><text x="695" y="328" font-size="21" font-weight="bold">C2 / connect accessories</text><text x="695" y="362" font-size="15">Pi USB host -> Type-C interface</text><text x="695" y="388" font-size="15">Digital headset / keyboard / peripherals</text><text x="695" y="445" font-size="21" font-weight="bold">LAN / sealed RJ45</text><text x="695" y="479" font-size="15">Short patch lead -> Pi Ethernet</text><text x="695" y="505" font-size="15">Gigabit target / data only</text><text x="695" y="555" font-size="18" font-weight="bold">Upper side shoulder controls</text><text x="695" y="585" font-size="15">Recessed sealed power/shutdown button</text><text x="695" y="612" font-size="15">Blanked headset/PTT provision</text><text x="695" y="639" font-size="15" fill="#b8c8c0">Pinout and power controller to be selected</text><path d="M35 764H1065" stroke="#38504a"/><text x="35" y="796" font-size="15" fill="#c6ed82">Wet operation requires specified sealing caps or matched sealed cables.</text></g></svg>