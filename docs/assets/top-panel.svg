<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 930" role="img" aria-labelledby="title desc">
<title id="title">AuMaNET top panel revision 7: HaLow, dual LTE and GNSS</title><desc id="desc">Concept top view. Rear left HaLow, rear right LTE main, front left LTE auxiliary, front right GPS coax exit. Centre sealed Ethernet and two USB-C ports. Positions are schematic, not a drilling template or validated RF separation.</desc>
<rect width="1200" height="930" rx="18" fill="#101c1c"/><g font-family="Arial,sans-serif" fill="#f0f3e8">
<text x="35" y="40" font-size="15" letter-spacing="2" fill="#c6ed82">AuMaNET / TOP PANEL / REVISION 7</text><text x="35" y="82" font-size="30" font-weight="bold">HaLow + cellular + positioning</text><text x="35" y="111" font-size="16" fill="#b8c8c0">Looking down / functional placement concept / not to scale / not a drilling template</text>
<text x="220" y="155" font-size="14">REAR / AWAY FROM OPERATOR</text><rect x="40" y="180" width="620" height="565" rx="36" fill="#344735" stroke="#9aaa82" stroke-width="3"/><rect x="65" y="205" width="570" height="515" rx="22" fill="#20352c" stroke="#9aaa82" stroke-dasharray="7 6"/>
<g fill="none" stroke="#8a9c83" stroke-dasharray="5 5"><circle cx="160" cy="285" r="65"/><circle cx="540" cy="285" r="65"/><circle cx="160" cy="625" r="65"/><circle cx="540" cy="625" r="65"/></g>
<g fill="#14271f" stroke-width="3"><circle cx="160" cy="285" r="32" stroke="#c6ed82"/><circle cx="540" cy="285" r="32" stroke="#ffd39b"/><circle cx="160" cy="625" r="32" stroke="#ffd39b"/><circle cx="540" cy="625" r="32" stroke="#8cc4d0"/></g>
<g text-anchor="middle" font-size="14" font-weight="bold"><text x="160" y="290">H</text><text x="540" y="290">M</text><text x="160" y="630">A</text><text x="540" y="630">G</text><text x="160" y="378">HALOW</text><text x="540" y="378">LTE MAIN</text><text x="160" y="711">LTE AUX</text><text x="540" y="711">GPS / GNSS</text></g>
<g text-anchor="middle" font-size="12" fill="#b8c8c0"><text x="160" y="399">Heltec radio</text><text x="540" y="399">Cellular Tx / Rx</text><text x="160" y="578">Diversity / MIMO</text><text x="540" y="578">Sealed coax exit to sky-facing puck</text></g>
<rect x="302" y="318" width="96" height="80" rx="14" fill="#14271f" stroke="#8cc4d0" stroke-width="3"/><text x="350" y="352" text-anchor="middle" font-size="16" font-weight="bold">LAN</text><text x="350" y="377" text-anchor="middle" font-size="12">Sealed RJ45</text>
<g fill="#14271f" stroke="#8cc4d0" stroke-width="3"><rect x="238" y="452" width="84" height="44" rx="18"/><rect x="378" y="452" width="84" height="44" rx="18"/></g><g text-anchor="middle" font-size="13"><text x="280" y="478">C1</text><text x="420" y="478">C2</text><text x="280" y="522">USB-C CHARGE</text><text x="420" y="522">USB-C HOST</text></g>
<g fill="#c6ed82"><circle cx="315" cy="232" r="5"/><circle cx="350" cy="232" r="5"/><circle cx="385" cy="232" r="5"/></g><text x="350" y="259" text-anchor="middle" font-size="11">BAT / POWER / LINK</text><text x="220" y="779" font-size="14">FRONT / OPERATOR SIDE</text>
<text x="710" y="211" font-size="21" font-weight="bold">Four separate RF paths</text><g font-size="16"><text x="710" y="248">H: Heltec -> matched pigtail -> HaLow</text><text x="710" y="282">M: EM7430 MAIN -> LTE antenna 1</text><text x="710" y="316">A: EM7430 AUX -> LTE antenna 2</text><text x="710" y="350">G: EM7430 GNSS -> matching GPS puck</text></g>
<text x="710" y="407" font-size="20" font-weight="bold">Local phone connection</text><g font-size="16"><text x="710" y="441">Pi onboard Wi-Fi / Bluetooth antenna</text><text x="710" y="471">No extra top RF socket in first build</text><text x="710" y="501">Keep antenna area clear of metal</text></g>
<text x="710" y="558" font-size="20" font-weight="bold">Internal modem connection</text><g font-size="16"><text x="710" y="592">Pi USB -> WWAN USB adapter -> EM7430</text><text x="710" y="622">SIM access and GNSS data over USB</text><text x="710" y="652">HaLow remains on its separate HAT</text></g><text x="710" y="707" font-size="15" fill="#ffd39b">Corner spacing is a placement intent,</text><text x="710" y="731" font-size="15" fill="#ffd39b">not verified antenna isolation.</text>
<path d="M35 812H1165" stroke="#38504a"/><g font-size="14" fill="#b8c8c0"><text x="35" y="844">120 x 95 mm cap remains provisional: seven interfaces plus caps, nuts, coax bends and gasket need a fit study.</text><text x="35" y="871">GPS puck may sit outside the cap on its cable. No generic antenna splitter or shared LTE/HaLow antenna.</text><text x="35" y="898">Verify LTE + HaLow + GNSS coexistence, loaded power, sealing and local Wi-Fi through the finished case.</text></g></g></svg>