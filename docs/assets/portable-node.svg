<text x="508" y="451" font-size="14" fill="#8cc4d0">Cable aisle: GPS USB + power + future monitor</text><text x="508" y="477" font-size="13">Insulated divider • removable trays • measured bend clearances</text><text x="508" y="503" font-size="13">Clear interior target: 230 × 110 × 85 mm</text>
