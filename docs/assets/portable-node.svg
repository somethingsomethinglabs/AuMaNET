<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
<title id="title">AuMaNET portable Pi 4 radio concept</title><desc id="desc">Military-style enclosure concept with Pi 4, Heltec HAT and radio in one bay, protected six-cell battery pack in another, external USB GPS puck and a regulated five-volt power path. Proposed dimensions and estimated runtime require validation.</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#25403a" stroke-width=".5"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#c6ed82"/></marker></defs>
