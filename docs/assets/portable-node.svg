<g font-size="14" text-anchor="middle"><text x="142" y="742">Matched 12.6 V charger</text><text x="142" y="762" fill="#b8c8c0">Load isolated during charging</text><text x="412" y="742">3S2P pack + BMS + fuse</text><text x="412" y="762" fill="#b8c8c0">6 matched cells / ~73.4 Wh</text><text x="682" y="742">5 V buck → USB-C</text><text x="682" y="762" fill="#b8c8c0">Pololu D24V50F5 candidate</text><text x="945" y="742">Pi → HAT + USB GPS</text><text x="945" y="762" fill="#b8c8c0">No raw battery rail to Pi</text></g>
