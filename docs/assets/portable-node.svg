<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 880" role="img" aria-labelledby="t d"><title id="t">AuMaNET three-zone modular radio</title><desc id="d">Battery base with design TBD, central Pi and Heltec core, top sealed USB-C charging and accessory ports plus Ethernet and antenna. Charging implementation is TBD; Pi receives regulated five volts through its internal USB-C power inlet.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#c6ed82"/></marker></defs><rect width="1100" height="880" rx="16" fill="#101c1c"/><g font-family="Arial,sans-serif" fill="#f0f3e8"><text x="35" y="38" font-size="14" letter-spacing="3" fill="#c6ed82">AuMaNET / PORTABLE NODE 06</text><text x="35" y="77" font-size="30" font-weight="bold">Battery below. Compute centre. Interfaces above.</text><text x="35" y="108" font-size="16" fill="#b8c8c0">ties1887-inspired adaptation / screw-fastened unit / proposed layout, not released CAD</text>
<rect x="60" y="228" width="300" height="370" rx="18" fill="#3b4b31" stroke="#95a67c" stroke-width="3"/><path d="M60 535H360" stroke="#9baa83" stroke-width="3"/><rect x="54" y="186" width="312" height="65" rx="15" fill="#293b30" stroke="#95a67c" stroke-width="3"/><rect x="77" y="273" width="265" height="229" rx="8" fill="#27382d" stroke="#7e926e"/><text x="103" y="318" font-size="25" font-weight="bold">AuMaNET</text><circle cx="375" cy="280" r="12" fill="#c6ed82" stroke="#f0f3e8"/><circle cx="375" cy="323" r="12" fill="#344735" stroke="#f0f3e8" stroke-dasharray="4 3"/><text x="103" y="348" font-size="14" fill="#c6ed82">PI 4 / HELTEC HC01P V2</text><path d="M104 389H314M104 405H314M104 421H314" stroke="#718763" stroke-width="6"/><text x="105" y="472" font-size="14">Sealed power button / PTT blank on side</text><text x="102" y="574" font-size="18">BATTERY / DESIGN TBD</text><path d="M92 186V137" stroke="#c6ed82" stroke-width="12" stroke-linecap="round"/><g fill="#15251e" stroke="#b8c8c0" stroke-width="2"><ellipse cx="145" cy="187" rx="19" ry="9"/><ellipse cx="199" cy="187" rx="19" ry="9"/><ellipse cx="253" cy="187" rx="19" ry="9"/><ellipse cx="313" cy="187" rx="19" ry="9"/></g><text x="64" y="639" font-size="15">One carried unit; no twist-lock battery</text><text x="64" y="662" font-size="13" fill="#b8c8c0">Initial budget: 240 H x 120 W x 95 D mm</text>
<text x="430" y="153" font-size="20" font-weight="bold">Vertical section / service layout</text><rect x="430" y="175" width="620" height="100" rx="10" fill="#213c35" stroke="#8cc4d0"/><text x="450" y="201" font-size="18" font-weight="bold">TOP / 45 mm routing and connector reserve</text><text x="450" y="229" font-size="15">C1: USB-C CHARGE   |   C2: USB ACCESSORY HOST</text><text x="450" y="254" font-size="15">LAN / HaLow / LTE MAIN + AUX / GNSS coax exit</text><rect x="430" y="286" width="620" height="160" rx="10" fill="#294333" stroke="#c6ed82"/><text x="450" y="314" font-size="18" font-weight="bold">CENTRE / 105 mm core reserve</text><text x="450" y="344" font-size="16">Pi 4B + Heltec stack + USB EM7430 on removable tray</text><text x="450" y="373" font-size="15">Regulated 5 V supply -> Pi internal USB-C power</text><text x="450" y="401" font-size="14" fill="#b8c8c0">Battery system TBD; core heat path to outer plate</text><text x="450" y="426" font-size="14" fill="#b8c8c0">USB accessory + EM7430 on USB / integrated GNSS candidate</text><rect x="430" y="457" width="620" height="142" rx="10" fill="#3c4029" stroke="#ffd39b"/><text x="450" y="485" font-size="18" font-weight="bold">BOTTOM / 70 mm battery reserve</text><rect x="450" y="504" width="490" height="60" rx="10" fill="#819661" stroke="#b6c590"/><text x="452" y="585" font-size="14">Reserved battery volume; cell format and capacity TBD</text><text x="430" y="627" font-size="14" fill="#ffd39b">Fit, thermal behaviour, sealing and charge board remain validation gates.</text><text x="430" y="650" font-size="13" fill="#b8c8c0">Connector cap or correctly sealed mating cable required in wet conditions.</text>
<path d="M35 689H1065" stroke="#38504a"/><text x="35" y="721" font-size="18" font-weight="bold">Charging and power / functional paths</text><g fill="#192a29" stroke="#7e926e"><rect x="35" y="740" width="224" height="73" rx="7"/><rect x="300" y="740" width="235" height="73" rx="7"/><rect x="576" y="740" width="210" height="73" rx="7"/><rect x="827" y="740" width="238" height="73" rx="7"/></g><g text-anchor="middle" font-size="14"><text x="147" y="766">USB-C CHARGING</text><text x="147" y="791" fill="#b8c8c0">Input protocol TBD</text><text x="417" y="766">Battery system TBD</text><text x="417" y="791" fill="#b8c8c0">Cells / charger / protection TBD</text><text x="681" y="766">Regulated 5 V output</text><text x="681" y="791" fill="#b8c8c0">3 A minimum / 15 W</text><text x="946" y="766">Rated USB-C lead -> Pi/HAT</text><text x="946" y="791" fill="#b8c8c0">No GPIO power adapter needed</text></g><g stroke="#c6ed82" stroke-width="2" marker-end="url(#a)"><path d="M259 776H290"/><path d="M535 776H566"/><path d="M786 776H817"/></g><text x="35" y="852" font-size="15" fill="#c6ed82">Battery runtime TBD / 5 V 3 A minimum / optional 5 A headroom / validate total load</text></g></svg>
