name: Blind app experiment

on:
  pull_request:
    branches: [testing]
    paths:
      - 'experiments/blind-app/**'
      - '.github/workflows/blind-app-experiment.yml'
  push:
    branches: [testing]
    paths:
      - 'experiments/blind-app/**'
      - '.github/workflows/blind-app-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify independent prototype state transitions
        working-directory: experiments/blind-app/prototype
        run: node --test tests/*.test.mjs
