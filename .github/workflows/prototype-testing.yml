name: Prototype app review build

on:
  pull_request:
    branches: [testing]
  push:
    branches: [testing]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prototype-app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --ignore-scripts
      - run: npm run web:build
      - run: npm run check -w @aumanet/app
      - run: node --test dev/tests/map-connections.test.mjs dev/tests/vector-map-contract.test.mjs
      - run: npm run sync -w @aumanet/mobile
      - name: Install Android platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Build review APK
        working-directory: dev/mobile/android
        run: bash gradlew --no-daemon assembleDebug
      - name: Record build identity
        env:
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p review-build
          cp dev/mobile/android/app/build/outputs/apk/debug/app-debug.apk review-build/
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const sha256=createHash('sha256').update(readFileSync('review-build/app-debug.apk')).digest('hex');
          writeFileSync('review-build/manifest.json',JSON.stringify({schema:'aumanet.review-build.v1',head:process.env.REVIEW_HEAD,builtCommit:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),sha256,scope:'Prototype review build; no physical device acceptance'},null,2)+'\n');
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: aumanet-prototype-${{ github.sha }}
          path: review-build/
          retention-days: 14
