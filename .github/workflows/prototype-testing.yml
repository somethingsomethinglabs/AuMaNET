name: Prototype app review build

on:
  pull_request:
    branches: [testing, nightly, stable]
  push:
    branches: [testing, nightly]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prototype-app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ui-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify stable promotion preserves the candidate tree
        if: github.event_name == 'pull_request' && github.base_ref == 'stable'
        env:
          CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          merge_tree=$(git rev-parse 'HEAD^{tree}')
          candidate_tree=$(git rev-parse "${CANDIDATE_COMMIT}^{tree}")
          if [[ "$merge_tree" != "$candidate_tree" ]]; then
            echo "::error::The stable merge changes the candidate tree. Promote the exact phone-tested tree."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: Verify settings and location controls
        env:
          AUMANET_TEST_URL: http://127.0.0.1:5181/
        run: |
          npm run dev -w @aumanet/app -- --port 5181 --strictPort > /tmp/aumanet-ui.log 2>&1 &
          server=$!
          cleanup() {
            result=$?
            if [ "$result" -ne 0 ]; then tail -n 100 /tmp/aumanet-ui.log; fi
            kill "$server" || true
            exit "$result"
          }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$AUMANET_TEST_URL" > /dev/null; then break; fi
            sleep 1
          done
          npm run web:test:ui
          node dev/tests/offline-area-browser.mjs
          node dev/tests/connected-map-handoff-browser.mjs
          node dev/tests/bandwidth-scenario-browser-verification.mjs
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --ignore-scripts
      - run: npm run web:build
      - run: npm run web:test
      - run: npm run check -w @aumanet/app
      - run: node --test dev/tests/map-connections.test.mjs dev/tests/vector-map-contract.test.mjs dev/tests/vector-downloads.test.mjs
      - run: node dev/tests/native-vector-downloads.mjs
      - name: Verify native voice routing ownership
        run: node dev/tests/native-voice-telecom.mjs --output output/native-voice-telecom
      - name: Verify preserved message storage and trusted connection recovery
        run: |
          node dev/tests/native-group-messages-store.mjs --jdk "$JAVA_HOME" --output output/native-message-store
          node dev/tests/native-trusted-connection.mjs --jdk "$JAVA_HOME" --output output/native-trusted-connection
          node dev/tests/native-diagnostic-export.mjs --output output/native-diagnostic-export
          node dev/tests/native-gateway-radio-settings.mjs --jdk "$JAVA_HOME" --output output/native-radio-settings
          node dev/tests/native-appearance-preferences.mjs --output output/native-appearance
      - name: Verify connection-test transport and voice pause
        run: |
          node dev/tests/native-link-benchmark.mjs --jdk "$JAVA_HOME" --output output/native-link-benchmark
          node dev/tests/native-link-benchmark-voice.mjs --output output/native-link-benchmark-voice
      - run: npm run sync -w @aumanet/mobile
      - name: Install Android platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Build review APK
        working-directory: dev/mobile/android
        run: bash gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Record build identity
        env:
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p review-build
          cp dev/mobile/android/app/build/outputs/apk/debug/app-debug.apk review-build/
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const sha256=createHash('sha256').update(readFileSync('review-build/app-debug.apk')).digest('hex');
          writeFileSync('review-build/manifest.json',JSON.stringify({schema:'aumanet.review-build.v1',head:process.env.REVIEW_HEAD,builtCommit:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),sha256,scope:'Prototype review build; no physical device acceptance'},null,2)+'\n');
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: aumanet-prototype-${{ github.sha }}
          path: review-build/
          retention-days: 14
